name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt / clippy / test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev mesa-vulkan-drivers \
            libx11-xcb-dev libxcb1-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb-shape0-dev \
            libfontconfig-dev libfreetype-dev libssl-dev libzstd-dev \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libxi-dev libxtst-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib

  package:
    name: package ${{ matrix.target }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev mesa-vulkan-drivers \
            libx11-xcb-dev libxcb1-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb-shape0-dev \
            libfontconfig-dev libfreetype-dev libssl-dev libzstd-dev \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libxi-dev libxtst-dev \
            dpkg-dev fakeroot curl
      - name: 打包 (Unix)
        if: runner.os != 'Windows'
        run: bash packaging/package.sh --build --target ${{ matrix.target }}
      - name: 打包 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh packaging/package.ps1 -Build -Target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: transel-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/*.msi
            dist/*.zip
          if-no-files-found: error
